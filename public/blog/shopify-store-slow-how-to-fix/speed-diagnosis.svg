<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">Find the cause of a slow Shopify store</title>
<desc id="desc">Test representative pages, identify whether loading, interaction or layout is failing, investigate the matching bottleneck, test a fix on a duplicate theme, verify shopping flows, and monitor real users.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#525252"/></marker></defs>
<rect width="1400" height="900" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#171717">
<text x="56" y="65" font-size="18" letter-spacing="2" fill="#737373">SCALEFRONT · SHOPIFY PERFORMANCE</text>
<text x="56" y="125" font-size="40" font-weight="700">Find the bottleneck before changing code</text>
<rect x="235" y="165" width="930" height="100" rx="12" fill="#171717"/>
<text x="700" y="204" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">Test homepage, product and collection pages</text>
<text x="700" y="240" text-anchor="middle" fill="#e5e5e5" font-size="22">Compare real-user reports with a repeatable lab test</text>
<g fill="none" stroke="#525252" stroke-width="3" marker-end="url(#arrow)"><path d="M700 265V292H254V325"/><path d="M700 265V325"/><path d="M700 265V292H1146V325"/></g>
<g stroke="#d4d4d4" stroke-width="2" fill="#fafafa"><rect x="50" y="330" width="408" height="275" rx="12"/><rect x="496" y="330" width="408" height="275" rx="12"/><rect x="942" y="330" width="408" height="275" rx="12"/></g>
<g font-size="28" font-weight="700"><text x="80" y="378">Slow main content?</text><text x="526" y="378">Delayed clicks?</text><text x="972" y="378">Content jumping?</text></g>
<g font-size="23" fill="#525252"><text x="80" y="419">Investigate LCP</text><text x="526" y="419">Investigate INP</text><text x="972" y="419">Investigate CLS</text></g>
<g font-size="23"><text x="80" y="477">Main image size and discovery</text><text x="80" y="521">Critical CSS and requests</text><text x="80" y="565">HTML and Liquid rendering</text><text x="526" y="477">Long JavaScript tasks</text><text x="526" y="521">Cart and variant handlers</text><text x="526" y="565">DOM updates and app scripts</text><text x="972" y="477">Image and widget dimensions</text><text x="972" y="521">Late banners and embeds</text><text x="972" y="565">Font swaps and fallback sizes</text></g>
<g fill="none" stroke="#525252" stroke-width="3"><path d="M254 605V645H700M1146 605V645H700"/><path d="M700 605V680" marker-end="url(#arrow)"/></g>
<rect x="150" y="686" width="1100" height="94" rx="12" fill="#f5f5f5" stroke="#171717" stroke-width="2"/>
<text x="700" y="724" text-anchor="middle" font-size="26" font-weight="700">Test a focused fix on a duplicate theme</text>
<text x="700" y="760" text-anchor="middle" font-size="22">Verify variants, cart, search and affected checkout integrations</text>
<text x="700" y="831" text-anchor="middle" font-size="24" font-weight="700">Publish carefully → Retest the same pages → Monitor real users</text>
<text x="700" y="873" text-anchor="middle" font-size="18" fill="#737373">Diagnosis guide, not measured store results or a guaranteed score improvement.</text>
</g></svg>
